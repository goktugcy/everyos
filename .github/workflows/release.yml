name: Signed EveryOS release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # Only a commit of main that passed CI is released.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Wait for green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 100); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            if [ -n "$run" ] && [ "$(jq -r .status <<<"$run")" = completed ]; then
              echo "CI: $(jq -r '.conclusion + " " + .url' <<<"$run")"
              [ "$(jq -r .conclusion <<<"$run")" = success ] && exit 0
              echo "::error::CI did not pass for $GITHUB_SHA; nothing is released."
              exit 1
            fi
            sleep 30
          done
          echo "::error::CI did not finish for $GITHUB_SHA in time."
          exit 1
  package:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify tag and source version
        run: node -e 'if ("v" + JSON.parse(require("fs").readFileSync("package.json")).version !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - run: pnpm build
      - run: python3 scripts/package.py --arch arm64
      - run: python3 scripts/package.py --arch amd64
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-packages
          path: dist/packages/*.deb
  sign:
    needs: package
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-packages
          path: dist/packages
      - name: Sign release metadata
        env:
          EVERYOS_RELEASE_PRIVATE_KEY: ${{ secrets.EVERYOS_RELEASE_PRIVATE_KEY }}
        run: |
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$EVERYOS_RELEASE_PRIVATE_KEY" > "$key_file"
          min_version=$(node -p 'JSON.parse(require("fs").readFileSync("packaging/release-policy.json")).minVersion')
          node scripts/sign-release.ts --version "${GITHUB_REF_NAME#v}" --min-version "$min_version" --key-file "$key_file" --notes-file docs/release-notes.md
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/packages/*.deb dist/packages/release.json dist/packages/everyos-release-public.pem dist/packages/install.sh dist/packages/install.sh.sig packaging/install.py --repo "$GITHUB_REPOSITORY" --verify-tag --title "EveryOS ${GITHUB_REF_NAME#v}" --notes-file docs/release-notes.md
