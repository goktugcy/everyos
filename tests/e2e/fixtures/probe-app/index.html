<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Probe</title>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <dl>
      <dt>connected</dt>
      <dd data-probe="connected">no</dd>
      <dt>runs</dt>
      <dd data-probe="runs"></dd>
      <dt>locale</dt>
      <dd data-probe="locale"></dd>
      <dt>scheme</dt>
      <dd data-probe="scheme"></dd>
      <dt>parent DOM</dt>
      <dd data-probe="parentDom"></dd>
      <dt>cookie</dt>
      <dd data-probe="cookie"></dd>
      <dt>localStorage</dt>
      <dd data-probe="localStorage"></dd>
      <dt>API</dt>
      <dd data-probe="api"></dd>
      <dt>forbidden call</dt>
      <dd data-probe="forbidden"></dd>
      <dt>answer</dt>
      <dd data-probe="answer"></dd>
      <dt>opened</dt>
      <dd data-probe="opened"></dd>
      <dt>saved</dt>
      <dd data-probe="saved"></dd>
      <dt>wallpaper</dt>
      <dd data-probe="wallpaper"></dd>
      <dt>preview</dt>
      <dd data-probe="preview"></dd>
      <dt>appearance changed</dt>
      <dd data-probe="appearanceChanged"></dd>
    </dl>
    <button type="button" data-action="ask">Ask</button>
    <button type="button" data-action="open">Open file</button>
    <button type="button" data-action="save">Save file</button>
    <button type="button" data-action="wallpaper">Wallpaper</button>
  </body>
</html>
