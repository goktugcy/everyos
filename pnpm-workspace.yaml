packages:
  - apps/*
  - packages/*

# Centralized dependency versions. Workspace packages reference these with
# "catalog:" so every package resolves the exact same version.
catalog:
  hono: 4.13.13
  "@hono/node-server": 2.1.4
  zod: 4.6.5
  yaml: 2.9.1
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.4
  "@vitejs/plugin-react": 6.1.2
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  i18next: 26.4.2
  react-i18next: 17.0.16
  zustand: 5.0.15
  lucide-react: 1.53.0
  radix-ui: 1.7.0
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  class-variance-authority: 0.7.1
  uqr: 0.1.3
  "@fontsource-variable/inter": 5.3.0

saveExact: true
engineStrict: true
# Only these packages may run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
