packages:
  - apps/*
  - packages/*
  - official-apps/*

# Centralized dependency versions. Workspace packages reference these with
# "catalog:" so every package resolves the exact same version.
catalog:
  hono: 4.13.13
  "@hono/node-server": 2.1.4
  zod: 4.6.5
  yaml: 2.9.1
  re2js: 2.8.6
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.4
  "@vitejs/plugin-react": 6.1.2
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  i18next: 26.4.2
  react-i18next: 17.0.16
  zustand: 5.0.15
  lucide-react: 1.53.0
  radix-ui: 1.7.0
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  class-variance-authority: 0.7.1
  uqr: 0.1.3
  "@fontsource-variable/inter": 5.3.0
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/sortable": 10.0.0
  "@dnd-kit/utilities": 3.2.2
  ws: 8.22.0
  "@types/ws": 8.18.2
  "@xterm/xterm": 6.0.0
  "@xterm/addon-fit": 0.11.0
  # Zero-dependency SMTP client for e-mail notifications (released 2026-10-03).
  nodemailer: 10.0.14
  # Database drivers behind the desktop apps' database:connect capability.
  pg: 8.23.1
  pg-cursor: 2.22.1
  "@types/pg": 8.23.1
  mysql2: 3.24.5
  # Markdown for official desktop apps (Notes, Markdown Editor): rendered, then sanitized.
  markdown-it: 15.0.2
  dompurify: 3.4.16
  # Official desktop apps. Editors: CodeMirror 6 (MIT).
  "@codemirror/state": 6.7.6
  "@codemirror/view": 6.43.13
  "@codemirror/commands": 6.11.1
  "@codemirror/language": 6.12.4
  "@codemirror/search": 6.7.2
  "@codemirror/autocomplete": 6.20.3
  "@codemirror/lint": 6.9.7
  "@codemirror/merge": 6.12.2
  "@codemirror/language-data": 6.5.2
  "@codemirror/lang-markdown": 6.5.2
  "@codemirror/lang-json": 6.0.2
  "@codemirror/lang-sql": 6.10.0
  "@lezer/common": 1.5.3
  "@lezer/highlight": 1.2.5
  "@replit/codemirror-minimap": 0.5.2
  highlight.js: 11.12.0
  # PDF Viewer (Apache-2.0), Whiteboard (MIT), Diff Viewer (BSD-3-Clause).
  pdfjs-dist: 6.4.299
  "@excalidraw/excalidraw": 0.18.1
  diff: 9.0.0
  # Cron Builder, JWT Inspector, Calendar and To-Do recurrence.
  cronstrue: 3.30.0
  cron-parser: 5.10.1
  jose: 6.2.12
  rrule: 2.8.1
  # Media metadata: tags and artwork (Music Player), EXIF (Image Viewer, Gallery).
  music-metadata: 12.0.0
  exifr: 7.1.3

saveExact: true
engineStrict: true
# Only these packages may run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
